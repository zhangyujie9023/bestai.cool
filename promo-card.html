<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bestai.cool 推广卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;background:#0a0a1a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}
.card{
  width:600px;padding:48px 40px 36px;
  background:linear-gradient(135deg,rgba(15,15,40,0.95),rgba(20,20,55,0.98));
  border:1px solid rgba(99,102,241,0.25);
  border-radius:24px;box-shadow:0 24px 80px rgba(99,102,241,0.15);
  text-align:center;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:-30%;left:-20%;width:140%;height:140%;
  background:radial-gradient(ellipse at 30% 20%,rgba(99,102,241,0.08) 0%,transparent 50%);
  pointer-events:none;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.15));
  padding:6px 20px;border-radius:50px;
  margin-bottom:28px;
}
.brand-box{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;
}
.brand-text{font-size:16px;font-weight:600;color:#c7d2fe;letter-spacing:-0.3px;}
h1{font-size:32px;font-weight:700;color:#f1f5f9;margin-bottom:8px;line-height:1.3;}
.highlight{background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{font-size:15px;color:#94a3b8;margin-bottom:32px;line-height:1.6;}
.stats{display:flex;justify-content:center;gap:40px;margin-bottom:36px;}
.stat{text-align:center;}
.stat-num{font-size:26px;font-weight:700;background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-label{font-size:12px;color:#64748b;margin-top:2px;}
.features{text-align:left;margin:0 auto 36px;max-width:400px;}
.feat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(99,102,241,0.08);font-size:14px;color:#cbd5e1;}
.feat:last-child{border-bottom:none;}
.feat-icon{width:22px;height:22px;border-radius:5px;background:rgba(99,102,241,0.15);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.cta{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;font-size:16px;font-weight:600;
  padding:14px 40px;border-radius:50px;text-decoration:none;
  box-shadow:0 4px 20px rgba(99,102,241,0.3);margin-bottom:20px;
}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(99,102,241,0.4);}
.url{font-size:13px;color:#4f46e5;font-weight:500;margin-bottom:24px;}
.footer{font-size:12px;color:#475569;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-box">B</div>
    <span class="brand-text">bestai.cool</span>
  </div>
  <h1>每天中午10分钟<br>读懂 <span class="highlight">AI 圈</span></h1>
  <p class="sub">不堆术语 · 不贩卖焦虑 · 只说人话</p>
  <div class="stats">
    <div class="stat"><div class="stat-num">1000+</div><div class="stat-label">信息源监控</div></div>
    <div class="stat"><div class="stat-num">10条</div><div class="stat-label">每日精选</div></div>
    <div class="stat"><div class="stat-num">永久</div><div class="stat-label">完全免费</div></div>
  </div>
  <div class="features">
    <div class="feat"><span class="feat-icon">🤖</span>多Agent自动采集全球AI资讯</div>
    <div class="feat"><span class="feat-icon">💡</span>每条附「元启划重点」毒舌点评</div>
    <div class="feat"><span class="feat-icon">📬</span>每天中午准时推送邮箱</div>
  </div>
  <a href="https://bestai.cool" class="cta">✨ 免费订阅</a>
  <div class="url">bestai.cool</div>
  <div class="footer">用 ❤️ 和 AI 构建</div>
</div>
</body>
</html>
